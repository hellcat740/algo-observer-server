<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据池总览 · 算法歧视众包观测</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f1f5f9; min-height: 100vh; color: #1e293b;
  }
  .topbar {
    background: #0f172a; color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .topbar .brand { font-weight: 700; font-size: 16px; }
  .topbar .uid { font-size: 12px; color: #94a3b8; font-family: ui-monospace, monospace; }
  .topbar a { color: #a5b4fc; text-decoration: none; font-size: 13px; margin-left: 14px; }
  .topbar a:hover { color: #c7d2fe; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 60px; }
  h2 { font-size: 20px; color: #0f172a; margin: 28px 0 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .card {
    background: #fff; border-radius: 14px; border: 1px solid #e2e8f0;
    padding: 20px; box-shadow: 0 2px 10px rgba(15,23,42,.04);
  }
  .card .num { font-size: 32px; font-weight: 800; color: #4f46e5; }
  .card .label { font-size: 13px; color: #64748b; margin-top: 4px; }
  .panel { background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; padding: 22px; box-shadow: 0 2px 10px rgba(15,23,42,.04); }
  .chart { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .bar {
    width: 100%; max-width: 46px; background: linear-gradient(180deg, #818cf8, #4f46e5);
    border-radius: 6px 6px 0 0; min-height: 3px; transition: height .4s;
  }
  .bar-val { font-size: 12px; font-weight: 700; color: #4338ca; }
  .bar-day { font-size: 11px; color: #94a3b8; }
  .plat { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .taobao { background: #fff7ed; color: #c2410c; }
  .tmall { background: #fef2f2; color: #b91c1c; }
  .jd { background: #fff1f2; color: #e11d48; }
  .pinduoduo { background: #fdf2f8; color: #be185d; }
  .hbar-row { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .hbar-name { width: 84px; font-size: 13px; color: #334155; text-align: right; flex-shrink: 0; }
  .hbar-track { flex: 1; background: #f1f5f9; border-radius: 8px; height: 26px; overflow: hidden; }
  .hbar-fill {
    height: 100%; background: linear-gradient(90deg, #818cf8, #4f46e5);
    border-radius: 8px; min-width: 2px; transition: width .4s;
  }
  .hbar-num { width: 64px; font-size: 12.5px; color: #64748b; flex-shrink: 0; }
  .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .badge.flag { background: #fef2f2; color: #b91c1c; }
  .badge.low { background: #fffbeb; color: #b45309; }
  .badge.fake { background: #fdf2f8; color: #be185d; }
  .badge.ok { background: #f0fdf4; color: #15803d; }
  .prod-item { border-top: 1px solid #f1f5f9; padding: 14px 0; }
  .prod-item:first-child { border-top: none; padding-top: 4px; }
  .prod-name { font-size: 14.5px; font-weight: 600; color: #0f172a; margin-bottom: 6px; }
  .prod-meta { font-size: 12.5px; color: #64748b; line-height: 1.9; }
  .empty {
    text-align: center; padding: 40px 20px; color: #64748b;
  }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  .btn {
    display: inline-block; text-decoration: none; cursor: pointer; border: none;
    border-radius: 10px; padding: 11px 22px; font-size: 14.5px; font-weight: 600;
    background: #4f46e5; color: #fff;
  }
  .btn:hover { background: #4338ca; }
  .notice { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin-top: 14px; line-height: 1.7; }
  .loading { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 14px; }
  .loading .spin { font-size: 34px; display: block; margin-bottom: 10px; animation: spin 1.2s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .footer-note { font-size: 12px; color: #94a3b8; margin-top: 32px; line-height: 1.8; text-align: center; }
  .footer-note a { color: #6366f1; text-decoration: none; }
  .footer-note a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="brand">📈 数据池总览</div>
    <div class="uid" id="uidText">匿名身份初始化中…</div>
  </div>
  <div>
    <a href="/">← 返回门户</a>
    <a href="/me">我的看板</a>
    <a href="/lab">比对分析</a>
    <a href="/about">方法说明</a>
  </div>
</div>

<div class="wrap">
  <div id="loading" class="panel loading">
    <span class="spin">⏳</span>正在加载数据池总览…
  </div>

  <div id="errorBox" class="panel empty" style="display:none">
    <div class="big">⚠️</div>
    <p style="font-size:16px;font-weight:600;color:#334155;margin-bottom:8px">加载失败</p>
    <p style="margin-bottom:20px" id="errorMsg">网络或服务异常</p>
    <button class="btn" id="retryBtn">重试</button>
  </div>

  <div id="main" style="display:none">
    <h2>数据规模</h2>
    <div class="cards">
      <div class="card"><div class="num" id="totalObs">–</div><div class="label">观测总数</div></div>
      <div class="card"><div class="num" id="totalUsers">–</div><div class="label">匿名用户数</div></div>
      <div class="card"><div class="num" id="totalProducts">–</div><div class="label">覆盖商品数</div></div>
      <div class="card"><div class="num" id="totalPlatforms">–</div><div class="label">覆盖平台数</div></div>
    </div>
    <div class="notice" id="latestNote" style="display:none"></div>

    <h2>平台分布</h2>
    <div class="panel" id="platPanel"></div>

    <h2>近 7 天采集趋势</h2>
    <div class="panel"><div class="chart" id="chart"></div></div>

    <h2>歧视分析情况</h2>
    <div class="panel" id="analysisPanel"></div>

    <div class="footer-note">
      本页展示的是全体参与者匿名上报汇总后的数据池情况，不含任何个人身份信息。<br>
      数据来自众包浏览器插件的匿名上报；统计口径、判定规则与已知限制详见 <a href="/about">方法说明</a>。
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- 本地匿名身份（UUID）：与 /me 页共用 localStorage obs_user_id ---------- */
  var KEY = 'obs_user_id';
  var uid = localStorage.getItem(KEY);

  /* 支持 #<UUID> 链接采纳身份（用户可能从带 hash 的插件链接跳转过来），
     采纳后清掉地址栏 hash，与 me.html 行为一致。 */
  var UUID_RE = /[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/;
  var hashMatch = location.hash.match(UUID_RE);
  if (hashMatch) {
    uid = hashMatch[0].toLowerCase();
    localStorage.setItem(KEY, uid);
    if (history.replaceState) history.replaceState(null, '', location.pathname);
  }

  if (!uid) {
    uid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(16).slice(2));
    localStorage.setItem(KEY, uid);
  }
  document.getElementById('uidText').textContent = '匿名身份：' + uid.slice(0, 8) + '…（仅本机保存）';

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'X-User-Id': uid }, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var PLAT = { taobao: '淘宝', tmall: '天猫', jd: '京东', pinduoduo: '拼多多', yangkeduo: '拼多多' };
  function platName(code) { return PLAT[code] || code; }

  /* ---------- 分区渲染 ---------- */

  function renderScale(d) {
    document.getElementById('totalObs').textContent = d.total_observations;
    document.getElementById('totalUsers').textContent = d.total_users;
    document.getElementById('totalProducts').textContent = d.total_products;
    document.getElementById('totalPlatforms').textContent = (d.platforms || []).length;
    if (d.latest_fetch_ts) {
      var t = new Date(d.latest_fetch_ts);
      if (!isNaN(t)) {
        var note = document.getElementById('latestNote');
        note.style.display = 'block';
        note.textContent = '🕐 最近一次观测：' + t.toLocaleString('zh-CN', { hour12: false });
      }
    }
  }

  function renderPlatforms(platforms) {
    var panel = document.getElementById('platPanel');
    if (!platforms || !platforms.length) {
      panel.innerHTML = '<div class="empty"><div class="big">📭</div>暂无平台数据</div>';
      return;
    }
    var max = Math.max.apply(null, platforms.map(function (p) { return p.count; }).concat([1]));
    panel.innerHTML = platforms.map(function (p) {
      var pct = Math.max(Math.round((p.count / max) * 100), 2);
      return '<div class="hbar-row">' +
        '<div class="hbar-name"><span class="plat ' + esc(p.platform_code) + '">' + esc(platName(p.platform_code)) + '</span></div>' +
        '<div class="hbar-track"><div class="hbar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="hbar-num">' + p.count + ' 条</div>' +
        '</div>';
    }).join('');
  }

  function renderTrend(days) {
    var chart = document.getElementById('chart');
    chart.innerHTML = '';
    if (!days || !days.length) {
      chart.innerHTML = '<div class="empty" style="flex:1">暂无趋势数据</div>';
      return;
    }
    var max = Math.max.apply(null, days.map(function (d) { return d.count; }).concat([1]));
    days.forEach(function (d) {
      var col = document.createElement('div');
      col.className = 'bar-col';
      var h = Math.round((d.count / max) * 100);
      col.innerHTML =
        '<div class="bar-val">' + d.count + '</div>' +
        '<div class="bar" style="height:' + (d.count ? Math.max(h, 4) : 3) + '%"></div>' +
        '<div class="bar-day">' + String(d.day).slice(5) + '</div>';
      chart.appendChild(col);
    });
  }

  function renderAnalysis(a) {
    var panel = document.getElementById('analysisPanel');

    if (!a || a.error) {
      panel.innerHTML = '<div class="empty"><div class="big">🛠️</div>' +
        '<p style="font-size:15px;font-weight:600;color:#334155;margin-bottom:6px">分析暂不可用</p>' +
        '<p>统计分析服务暂时开小差了，请稍后刷新重试。</p></div>';
      return;
    }

    var analyzed = a.total_products_analyzed || 0;
    if (!analyzed) {
      panel.innerHTML = '<div class="empty"><div class="big">🌱</div>' +
        '<p style="font-size:15px;font-weight:600;color:#334155;margin-bottom:6px">数据积累中，暂无可分析商品</p>' +
        '<p>同一商品需要至少 2 个不同匿名用户的观测才能做比对分析，欢迎多逛多采集。</p></div>';
      return;
    }

    var html = '';

    // 平台级复现结论横幅
    if (a.platform_suspected) {
      html += '<div class="notice" style="margin-top:0;margin-bottom:16px;background:#fef2f2;border-color:#fecaca;color:#991b1b">' +
        '🚨 跨商品复现检验：发现 ' + (a.flagged_products || 0) + ' 个商品存在显著价格差异（≥2 个复现），' +
        '该数据池呈现疑似系统性差别待遇模式。</div>';
    } else {
      html += '<div class="notice" style="margin-top:0;margin-bottom:16px">' +
        '📋 已分析 ' + analyzed + ' 个商品：' +
        (a.flagged_products || 0) + ' 个判定存在显著差异，' +
        (a.low_confidence_products || 0) + ' 个低置信疑似，暂无跨商品复现模式。</div>';
    }

    // 只列出有判定结论的商品（flag / low_confidence），其余折叠为一句话
    var notable = (a.products || []).filter(function (p) { return p.flag || p.low_confidence; });
    var rest = analyzed - notable.length;

    if (!notable.length) {
      html += '<div class="empty"><div class="big">✅</div>' +
        '<p style="font-size:15px;font-weight:600;color:#334155;margin-bottom:6px">暂未发现疑似价格歧视的商品</p>' +
        '<p>当前已分析商品均未达到判定阈值，数据持续增长后会自动重新分析。</p></div>';
    } else {
      notable.forEach(function (p) {
        var badges = '';
        if (p.flag) badges += '<span class="badge flag">显著差异</span> ';
        if (p.low_confidence) badges += '<span class="badge low">疑似（低置信）</span> ';
        if (p.fake_discount) badges += '<span class="badge fake">假折扣模式</span> ';

        var meta = [];
        if (p.diff_direction) meta.push(esc(p.diff_direction));
        if (p.median_price_diff_percent != null) meta.push('中位价差 ' + p.median_price_diff_percent + '%');
        if (p.mann_whitney && p.mann_whitney.p_value != null) {
          meta.push('MWU p=' + p.mann_whitney.p_value + (p.mann_whitney.significant ? '（显著）' : ''));
        }
        if (p.discount_depth_percent != null) meta.push('折扣深度 ' + p.discount_depth_percent + '%');
        if (p.user_count != null) meta.push('覆盖 ' + p.user_count + ' 个匿名用户');
        if (p.sample_total != null) meta.push('对比样本 ' + p.sample_total + ' 条');
        if (p.reason_code && p.reason_code.length) meta.push('判定依据：' + esc(p.reason_code.join(' / ')));

        var name = p.product_name || p.product_id;
        html += '<div class="prod-item">' +
          '<div class="prod-name">' + badges + esc(name) + '</div>' +
          '<div class="prod-meta">' + meta.join(' · ') + '</div>' +
          '</div>';
      });
    }

    if (rest > 0) {
      html += '<div class="prod-meta" style="margin-top:12px;color:#94a3b8">另有 ' + rest +
        ' 个商品已分析，未发现显著差异或样本不足。</div>';
    }
    if (a.analyzed_at) {
      var t = new Date(a.analyzed_at);
      if (!isNaN(t)) {
        html += '<div class="prod-meta" style="margin-top:8px;color:#cbd5e1">分析时间：' +
          t.toLocaleString('zh-CN', { hour12: false }) + '</div>';
      }
    }

    panel.innerHTML = html;
  }

  /* ---------- 加载 ---------- */

  function showState(which) {
    document.getElementById('loading').style.display = which === 'loading' ? 'block' : 'none';
    document.getElementById('errorBox').style.display = which === 'error' ? 'block' : 'none';
    document.getElementById('main').style.display = which === 'main' ? 'block' : 'none';
  }

  function load() {
    showState('loading');
    api('/api/pool/overview').then(function (d) {
      renderScale(d);
      renderPlatforms(d.platforms);
      renderTrend(d.last_7_days);
      renderAnalysis(d.analysis);
      showState('main');
    }).catch(function (e) {
      document.getElementById('errorMsg').textContent =
        '请求失败：' + e.message + '（服务可能正在冷启动，请稍后重试）';
      showState('error');
    });
  }

  document.getElementById('retryBtn').addEventListener('click', load);
  load();

  /* 首次进入顺带完成匿名建档（失败不阻塞页面） */
  api('/api/my/login', { method: 'POST' }).catch(function () {});
})();
</script>
</body>
</html>
