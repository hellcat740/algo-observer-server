<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 · 算法歧视众包观测</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #1e293b;
  }
  .box {
    background: #fff; border-radius: 18px; padding: 40px 36px; width: 100%;
    max-width: 400px; box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }
  .icon { font-size: 34px; text-align: center; margin-bottom: 10px; }
  h1 { font-size: 20px; text-align: center; color: #0f172a; margin-bottom: 6px; }
  .tip { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 26px; line-height: 1.7; }
  label { display: block; font-size: 13px; color: #475569; margin-bottom: 8px; font-weight: 600; }
  input {
    width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px;
    font-size: 15px; font-family: ui-monospace, monospace; outline: none; transition: border .15s;
  }
  input:focus { border-color: #4f46e5; }
  input.error { border-color: #ef4444; background: #fef2f2; }
  button {
    width: 100%; margin-top: 20px; padding: 13px; border: none; border-radius: 10px;
    background: #0f172a; color: #fff; font-size: 15.5px; font-weight: 700; cursor: pointer;
  }
  button:hover { background: #312e81; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  .msg.err { color: #dc2626; }
  .msg.ok { color: #059669; }
  .back { display: block; text-align: center; margin-top: 22px; color: #94a3b8; font-size: 13px; text-decoration: none; }
  .back:hover { color: #64748b; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🛡️</div>
  <h1>管理员登录</h1>
  <p class="tip">仅限项目维护者。密钥验证通过后将保存在本机浏览器，随后进入管理控制台（服务端只存密钥的哈希，不会明文留存）。</p>
  <form id="form">
    <label for="key">管理员密钥</label>
    <input id="key" type="password" placeholder="请输入管理员密钥" autocomplete="off" autofocus>
    <button id="btn" type="submit">登录并进入控制台</button>
    <div class="msg" id="msg"></div>
  </form>
  <a class="back" href="/">← 返回门户首页</a>
</div>

<script>
(function () {
  'use strict';
  var form = document.getElementById('form');
  var input = document.getElementById('key');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var key = input.value.trim();
    if (!key) { input.classList.add('error'); msg.className = 'msg err'; msg.textContent = '请输入密钥'; return; }
    btn.disabled = true;
    btn.textContent = '验证中…';
    msg.className = 'msg'; msg.textContent = '';

    fetch('/api/auth/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key })
    }).then(function (r) {
      if (!r.ok) {
        return r.json().then(function (d) { throw new Error(d.detail || ('HTTP ' + r.status)); });
      }
      return r.json();
    }).then(function () {
      /* 与旧控制台共用 localStorage 键：obs_api_key（之后请求自动带 X-API-Key） */
      localStorage.setItem('obs_api_key', key);
      msg.className = 'msg ok';
      msg.textContent = '登录成功，正在进入控制台…';
      setTimeout(function () { location.href = '/console'; }, 500);
    }).catch(function (err) {
      input.classList.add('error');
      msg.className = 'msg err';
      msg.textContent = '登录失败：' + err.message;
      btn.disabled = false;
      btn.textContent = '登录并进入控制台';
    });
  });

  input.addEventListener('input', function () { input.classList.remove('error'); });
})();
</script>
</body>
</html>
