<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>观测数据报告</title>
<style>
  body { max-width:960px; margin:24px auto; padding:0 20px 60px; background:#f3f4f6; color:#111827;
         font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { margin-bottom:20px; }
  h1 { font-size:22px; }
  .sub { color:#6b7280; font-size:13px; }
  #empty { background:#fff; border:1px dashed #d1d5db; border-radius:12px; padding:48px 24px;
           text-align:center; color:#6b7280; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:#fff; border-radius:12px; padding:16px; border:1px solid #e5e7eb; }
  .card .num { font-size:26px; font-weight:700; color:#4f46e5; }
  .card .label { color:#6b7280; font-size:12px; }
  section { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px 20px; margin-bottom:16px; }
  h2 { font-size:15px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #f3f4f6; }
  th { color:#6b7280; font-weight:500; }
  .pill { padding:1px 8px; border-radius:999px; font-size:11px; }
  .pill.ok { background:#dcfce7; color:#166534; }
  .pill.fail { background:#fee2e2; color:#991b1b; }
  .pill.pending { background:#fef9c3; color:#854d0e; }
  svg text { font-family:inherit; }
</style>
  <script type="module" crossorigin src="../report/report.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-DaKOjhqt.js">
  <link rel="modulepreload" crossorigin href="../assets/utils-CUEHBwO0.js">
</head>
<body>
  <header>
    <h1>观测数据报告</h1>
    <div class="sub">基于本插件本地留存的观测记录生成 · 数据仅保存在您的浏览器中</div>
  </header>

  <div id="empty" hidden>
    暂无观测数据。<br />
    请先到受支持平台（淘宝 / 天猫 / 京东 / 拼多多）的商品详情页，点击工具栏插件图标采集第一条数据。
  </div>

  <div id="content" hidden>
    <div class="cards" id="cards"></div>

    <section>
      <h2>各平台平均到手价对比</h2>
      <div id="chart-platform"></div>
    </section>

    <section>
      <h2>各城市平均到手价（Top 12）</h2>
      <div id="chart-city"></div>
    </section>

    <section>
      <h2>优惠幅度（原价 − 到手价）分布</h2>
      <div id="chart-discount"></div>
    </section>

    <section>
      <h2>采集明细</h2>
      <div id="detail-table"></div>
    </section>
  </div>

</body>
</html>
